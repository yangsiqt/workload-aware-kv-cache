[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "workload-aware-kv-cache"
version = "0.1.0"
description = "Long-context code-agent serving and KV-cache routing benchmark"
requires-python = ">=3.11"
dependencies = [
  "aiohttp==3.14.1",
  "fastapi==0.136.3",
  "pydantic==2.13.4",
  "PyYAML==6.0.3",
  "transformers==5.13.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["benchmarks*", "router*"]
